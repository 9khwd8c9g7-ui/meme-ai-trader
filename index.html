<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meme AI Trader</title><link rel="stylesheet" href="style.css"></head>
<body>
<header><div><h1>MEME AI TRADER</h1><p>Solana • FOMO Scanner • PAPER MODE</p></div><span class="pill">PAPER ONLY</span></header>
<main>
<section class="stats">
<div><small>Balance</small><strong id="balance">$100.00</strong></div>
<div><small>Equity</small><strong id="equity">$100.00</strong></div>
<div><small>P/L</small><strong id="pnl">$0.00</strong></div>
<div><small>Win rate</small><strong id="winrate">—</strong></div>
</section>
<section class="toolbar">
<button id="scan">Scan FOMO Coins</button>
<label>Risk/trade <input id="risk" type="number" value="5" min="1" max="25">%</label>
<label>Max daily loss <input id="daily" type="number" value="10" min="1" max="100">%</label>
</section>
<section><h2>FOMO Watchlist</h2><div id="coins" class="grid"></div></section>
<section><h2>Open Positions</h2><div id="positions"></div></section>
<section><h2>Trade History</h2><div id="history"></div></section>
</main>
<script src="app.js"></script></body></html>
